syntax = "proto3";
package monitoring.v1;
option go_package = "github.com/VojtechPastyrik/muthur-collector/proto/v1";

// Brain is the central service collectors talk to over mTLS. Replay protection
// (timestamp + nonce) is carried via gRPC metadata, not message fields, so the
// wire shape stays a pure data contract.
service Brain {
  // Ingest accepts an alert payload pushed by a collector. Identity comes
  // from the verified client cert (peer.Peer), not from the request body —
  // payload.cluster_id is cross-checked against the cert's cluster_id.
  rpc Ingest(AlertPayload) returns (IngestResponse);

  // BootstrapCert issues the first leaf cert to a collector that has no
  // prior credentials. Authenticated by a one-time bootstrap token in the
  // request body; the listener accepts cert-less handshakes for this RPC.
  rpc BootstrapCert(BootstrapRequest) returns (BootstrapResponse);

  // SignCSR renews a collector's leaf cert. Authenticated by the existing
  // client cert presented during the mTLS handshake; the CSR contributes
  // only the new public key.
  rpc SignCSR(SignCSRRequest) returns (SignCSRResponse);
}

message AlertPayload {
  string cluster_id    = 1;
  string alert_name    = 2;
  string severity      = 3;  // critical | warning | info
  string namespace     = 4;
  string pod_name      = 5;
  int64  fired_at      = 6;  // unix timestamp seconds
  string summary       = 7;
  string description   = 8;

  AlertTarget           target    = 9;
  repeated string       redacted_logs = 10;
  repeated MetricSeries metrics   = 11;
  repeated PodMeta      pod_metas = 12;
  repeated Label        labels    = 13;

  int32 total_log_lines    = 14;
  int32 redacted_log_lines = 15;
  int32 total_replacements = 16;

  string status = 17; // firing | resolved
  string grafana_base_url = 18; // collector-provided Grafana base URL

  repeated KubernetesEvent events = 19; // recent events on the alert target
}

message AlertTarget {
  string target_type  = 1; // pod | deployment | daemonset | node | pvc | namespace | unknown
  string pod_name     = 2;
  string deployment   = 3;
  string daemonset    = 4;
  string node         = 5;
  string pvc          = 6;
  string namespace    = 7;
  repeated string resolved_pods = 8;
}

message MetricSeries {
  string metric_name        = 1;
  string description        = 2;
  string unit               = 3;  // bytes | percent | count | seconds
  repeated DataPoint points = 4;
}

message DataPoint {
  int64  timestamp = 1;
  double value     = 2;
}

message PodMeta {
  string pod_name       = 1;
  string memory_limit   = 2;
  string memory_request = 3;
  string cpu_limit      = 4;
  string cpu_request    = 5;
  string node_name      = 6;
  int32  restart_count  = 7;
  string phase          = 8;
}

message Label {
  string name  = 1;
  string value = 2;
}

// KubernetesEvent carries scheduling/lifecycle context the LLM cannot see in
// logs or metrics — FailedScheduling, FailedMount, ImagePullBackOff reasons
// live only in events. Messages pass through the collector's redaction
// boundary like log lines.
message KubernetesEvent {
  string type                 = 1; // Normal | Warning
  string reason               = 2; // e.g. FailedScheduling, FailedMount
  string message              = 3; // redacted event message
  int64  first_timestamp      = 4; // unix timestamp seconds
  int64  last_timestamp       = 5; // unix timestamp seconds
  int32  count                = 6;
  string involved_object_name = 7; // pod/pvc/etc the event is about
}

message IngestResponse {}

message BootstrapRequest {
  string cluster_id       = 1;
  string bootstrap_token  = 2;
  string csr              = 3; // PEM-encoded certificate request
}

message BootstrapResponse {
  string certificate = 1; // PEM leaf
  string ca          = 2; // PEM intermediate CA
}

message SignCSRRequest {
  string csr = 1; // PEM
}

message SignCSRResponse {
  string certificate = 1; // PEM leaf
  string ca          = 2; // PEM intermediate CA
}
