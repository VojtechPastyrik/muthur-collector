{{- /*
  Secret carrying the bootstrap-only inputs the collector needs at startup:
  the brain's URL (plaintext, not sensitive but environment-specific) and
  the one-time bootstrap token (sensitive, single-use). Once bootstrap
  succeeds, the token can be deleted from the remote store — it is never
  re-read by a running collector.

  Two delivery shapes are supported:
    externalSecrets.enabled = true  → ExternalSecret pulls from a remote
                                       store (1Password, Vault, …)
    devSecrets.enabled      = true  → literal Secret for local dev
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "muthur-collector.fullname" . }}-secret
  labels:
    {{- include "muthur-collector.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "muthur-collector.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: CENTRAL_AGENT_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: {{ .Values.externalSecrets.centralAgentUrlProperty }}
    - secretKey: bootstrap-token
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: {{ .Values.externalSecrets.bootstrapTokenProperty }}
{{- end }}
{{- if and .Values.devSecrets.enabled (not .Values.externalSecrets.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muthur-collector.fullname" . }}-secret
  labels:
    {{- include "muthur-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  CENTRAL_AGENT_URL: {{ .Values.devSecrets.centralAgentUrl | quote }}
  bootstrap-token: {{ .Values.devSecrets.bootstrapToken | quote }}
{{- end }}
