apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muthur-collector.fullname" . }}
  labels:
    {{- include "muthur-collector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "muthur-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "muthur-collector.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "muthur-collector.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # bootstrap: enrol with the brain if the cert Secret is empty.
        # Idempotent: a non-empty Secret short-circuits to a no-op so pod
        # restarts don't burn the one-time bootstrap token.
        - name: bootstrap
          image: {{ include "muthur-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["bootstrap"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CERT_SECRET_NAME
              value: {{ include "muthur-collector.fullname" . }}-tls
          envFrom:
            - configMapRef:
                name: {{ include "muthur-collector.fullname" . }}-config
            - secretRef:
                name: {{ include "muthur-collector.fullname" . }}-secret
          volumeMounts:
            - name: vendor-ca
              mountPath: /secrets/vendor-ca
              readOnly: true
            - name: bootstrap-token
              mountPath: /secrets/bootstrap
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "muthur-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "muthur-collector.fullname" . }}-config
            - secretRef:
                name: {{ include "muthur-collector.fullname" . }}-secret
          volumeMounts:
            - name: tls
              mountPath: /secrets/tls/collector
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # The TLS Secret is created by the bootstrap init container and
        # updated in place by the renew CronJob. kubelet projects updates
        # into this mount; ClientReloader picks them up on the next outbound
        # handshake.
        - name: tls
          secret:
            secretName: {{ include "muthur-collector.fullname" . }}-tls
            optional: true
            defaultMode: 0400
        - name: vendor-ca
          secret:
            secretName: {{ include "muthur-collector.fullname" . }}-vendor-ca
            defaultMode: 0444
        - name: bootstrap-token
          secret:
            secretName: {{ include "muthur-collector.fullname" . }}-secret
            defaultMode: 0400
            items:
              - key: bootstrap-token
                path: token
