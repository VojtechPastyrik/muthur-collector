replicaCount: 1

image:
  repository: ghcr.io/vojtechpastyrik/muthur-collector
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Prometheus Operator ServiceMonitor for the /metrics endpoint. Enable when
# kube-prometheus-stack (or any Prometheus Operator) is present.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

config:
  clusterId: cluster-a
  # tenantId feeds the cert's SPIFFE URI SAN (spiffe://muthur/<tenantId>/<clusterId>).
  # Leave empty to use a plain CN-only identity — the brain will accept both.
  tenantId: ""
  # Set lokiEnabled: false on clusters without a logging stack — the collector
  # will still forward alerts, just without redacted log excerpts attached.
  lokiEnabled: true
  lokiUrl: http://loki.monitoring.svc:3100
  lokiLookbackMinutes: 15
  lokiMaxLogLines: 200
  prometheusUrl: http://prometheus.monitoring.svc:9090
  prometheusLookbackMinutes: 30
  prometheusEnabled: true
  # Grafana base URL sent with every forwarded alert — muthur uses it to build
  # per-cluster Explore deep links in notifications. Leave empty to omit.
  grafanaBaseUrl: ""
  logLevel: info
  redactLogStats: true
  redactExtraPatterns: ""
  # Redaction is a security boundary, so its size guards fail CLOSED: a log line
  # over redactMaxLineBytes is dropped (never forwarded raw), and once the
  # cumulative payload reaches redactMaxTotalBytes the remaining lines are
  # dropped. Bounds both PII-leak risk and the downstream LLM token bill.
  redactMaxLineBytes: 8192
  redactMaxTotalBytes: 262144
  # Per-string cap for free-text fields (alert annotations, label values,
  # metric descriptions). A string over this is replaced with a fail-closed
  # marker — closes an attacker-controlled-annotation inflation vector that
  # the per-line cap doesn't cover.
  redactMaxStringBytes: 16384
  # Max alerts processed concurrently. Under a storm, alerts over this ceiling
  # are dropped (counted in muthur_collector_alerts_dropped_total) instead of
  # spawning unbounded goroutines — the AlertManager webhook is never wedged.
  webhookMaxConcurrent: 50

# --- mTLS auth ---
# The collector enrols with the brain over a one-time bootstrap token
# (delivered via SOPS-encrypted ExternalSecret) and then talks pure mTLS for
# the gRPC Brain service (Ingest, SignCSR renewals). The init container
# persists the issued cert into a Kubernetes Secret managed by this chart
# (RBAC included).
auth:
  # Vendor root CA bundle (PEM) used to verify the brain on the bootstrap
  # call, before the collector has its own cert. Paste the contents of the
  # muthur-root-ca-tls.tls.crt the brain chart provisions, OR the public
  # cert exported from the central cluster after `helm install`.
  vendorCABundle: ""
  # CronJob that renews the cert before expiry. The cron fires often; the
  # collector renew binary skips the actual brain call while the current
  # cert still has more than `renewBefore` of validity left. This lets a
  # transient brain outage self-heal without rotating the cert on every
  # tick.
  #
  # Tune together with the brain tenant's certDuration:
  #   certDuration=168h + renewBefore=48h → renewal fires only in the last
  #   2 days, and 2 daily attempts of runway survive a brain outage.
  #   certDuration=24h  + renewBefore=0   → rotate every run (legacy).
  renewCron:
    enabled: true
    schedule: "30 3 * * *"
    renewBefore: "48h"
    resources:
      limits:
        cpu: 200m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 32Mi

externalSecrets:
  enabled: true
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  remoteSecretPath: muthur-collector/prod
  refreshInterval: 1h
  # Property name in the remote secret store that carries the URL of the
  # brain. Plaintext (not strictly sensitive) but kept here so the collector
  # chart can be installed without baking in environment-specific values.
  centralAgentUrlProperty: central-agent-url
  # Property name of the SHA-256-hashed one-time bootstrap token. After
  # successful bootstrap the token is invalidated server-side; this remote
  # entry can be deleted at that point.
  bootstrapTokenProperty: bootstrap-token

devSecrets:
  enabled: false
  centralAgentUrl: ""
  bootstrapToken: ""

resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
