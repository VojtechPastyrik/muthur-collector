replicaCount: 1

image:
  repository: ghcr.io/vojtechpastyrik/muthur-collector
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Prometheus Operator ServiceMonitor for the /metrics endpoint. Enable when
# kube-prometheus-stack (or any Prometheus Operator) is present.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

config:
  clusterId: cluster-a
  # tenantId feeds the cert's SPIFFE URI SAN (spiffe://muthur/<tenantId>/<clusterId>).
  # Leave empty to use a plain CN-only identity — the brain will accept both.
  tenantId: ""
  # Which backend serves log excerpts: "loki" or "victorialogs". These are NOT
  # interchangeable by URL — VictoriaLogs speaks Loki's ingestion API but not
  # its query API, so each has its own client and query language.
  logsBackend: loki
  # Which backend serves metric series: "prometheus" or "victoriametrics".
  # These two DO share the /api/v1/query_range contract; choosing
  # victoriametrics buys tenant headers and accurate labelling, not a
  # different protocol.
  metricsBackend: prometheus

  # Set lokiEnabled: false on clusters without a logging stack — the collector
  # will still forward alerts, just without redacted log excerpts attached.
  # The flag gates log enrichment whichever backend serves it.
  lokiEnabled: true
  lokiUrl: http://loki.monitoring.svc:3100
  lokiLookbackMinutes: 15
  lokiMaxLogLines: 200
  prometheusUrl: http://prometheus.monitoring.svc:9090
  prometheusLookbackMinutes: 30
  prometheusEnabled: true

  # VictoriaLogs — used when logsBackend is "victorialogs".
  victoriaLogsUrl: http://victoria-logs-single-server.monitoring.svc:9428
  victoriaLogsLookbackMinutes: 15
  victoriaLogsMaxLogLines: 200
  # Tenant headers. Leave empty on a single-tenant instance.
  victoriaLogsAccountId: ""
  victoriaLogsProjectId: ""

  # VictoriaMetrics — used when metricsBackend is "victoriametrics". On a
  # cluster deployment the tenant belongs in the URL path as shown; on a
  # single-node build drop the /select/0/prometheus prefix.
  victoriaMetricsUrl: http://vmselect.monitoring.svc:8481/select/0/prometheus
  victoriaMetricsLookbackMinutes: 30
  # Tenant headers, honoured by a cluster build started with
  # -enableMultitenancyViaHeaders (default since v1.150). Redundant when the
  # tenant is already in the URL path above.
  victoriaMetricsAccountId: ""
  victoriaMetricsProjectId: ""

  # Label matchers ANDed into every query, e.g. cluster="prod". REQUIRED when
  # one backend instance holds several clusters' data — without them a query
  # for namespace+pod can match an identically-named pod in another cluster
  # and enrich the alert with someone else's logs.
  logsExtraSelector: ""
  metricsExtraSelector: ""

  # Liveness. The collector beats to the brain on this interval; the brain
  # declares the cluster down after roughly 3 missed beats and notifies. A
  # final beat on SIGTERM retires the cluster, so a planned uninstall or
  # rollout does not page anyone.
  heartbeatEnabled: true
  heartbeatInterval: 60s
  # Alert accepted at /pipeline-ok as proof the cluster's own alerting path
  # still delivers. Route it from AlertManager instead of filtering it out —
  # see "Proving the alerting path works" in the README. Matched strictly: any
  # other alert posted to that path is ignored rather than counted as proof.
  pipelineProbeAlertName: Watchdog
  # Grafana base URL sent with every forwarded alert — muthur uses it to build
  # per-cluster Explore deep links in notifications. Leave empty to omit.
  grafanaBaseUrl: ""
  # Grafana datasource holding this cluster's logs, used for the Explore deep
  # link. Empty picks a default matching logsBackend ("Loki" or
  # "VictoriaLogs") — VictoriaLogs needs the victoriametrics-logs-datasource
  # plugin, the Loki datasource cannot query it.
  grafanaLogsDatasource: ""
  logLevel: info
  redactLogStats: true
  redactExtraPatterns: ""
  # Redaction is a security boundary, so its size guards fail CLOSED: a log line
  # over redactMaxLineBytes is dropped (never forwarded raw), and once the
  # cumulative payload reaches redactMaxTotalBytes the remaining lines are
  # dropped. Bounds both PII-leak risk and the downstream LLM token bill.
  redactMaxLineBytes: 8192
  redactMaxTotalBytes: 262144
  # Per-string cap for free-text fields (alert annotations, label values,
  # metric descriptions). A string over this is replaced with a fail-closed
  # marker — closes an attacker-controlled-annotation inflation vector that
  # the per-line cap doesn't cover.
  redactMaxStringBytes: 16384
  # Max alerts processed concurrently. Under a storm, alerts over this ceiling
  # are dropped (counted in muthur_collector_alerts_dropped_total) instead of
  # spawning unbounded goroutines — the AlertManager webhook is never wedged.
  webhookMaxConcurrent: 50

# --- mTLS auth ---
# The collector enrols with the brain over a one-time bootstrap token
# (delivered via SOPS-encrypted ExternalSecret) and then talks pure mTLS for
# the gRPC Brain service (Ingest, SignCSR renewals). The init container
# persists the issued cert into a Kubernetes Secret managed by this chart
# (RBAC included).
auth:
  # Transport to the brain.
  #   mtls   — gRPC on the brain's mTLS port; the path to the brain must pass
  #            TLS through (IngressRouteTCP, TLSRoute, ssl-passthrough).
  #   signed — HTTPS through any TLS-terminating edge (Cloudflare, cloud LB,
  #            plain Ingress). Requests are signed with the collector cert and
  #            HPKE-sealed to the brain, so the edge only sees ciphertext.
  # central-agent-url is host:port for mtls and https://host for signed.
  mode: mtls
  # Vendor root CA bundle (PEM) used to verify the brain on the bootstrap
  # call, before the collector has its own cert. Paste the contents of the
  # muthur-root-ca-tls.tls.crt the brain chart provisions, OR the public
  # cert exported from the central cluster after `helm install`.
  vendorCABundle: ""
  # CronJob that renews the cert before expiry. The cron fires often; the
  # collector renew binary skips the actual brain call while the current
  # cert still has more than `renewBefore` of validity left. This lets a
  # transient brain outage self-heal without rotating the cert on every
  # tick.
  #
  # Tune together with the brain tenant's certDuration:
  #   certDuration=168h + renewBefore=48h → renewal fires only in the last
  #   2 days, and 2 daily attempts of runway survive a brain outage.
  #   certDuration=24h  + renewBefore=0   → rotate every run (legacy).
  renewCron:
    enabled: true
    schedule: "30 3 * * *"
    renewBefore: "48h"
    resources:
      limits:
        cpu: 200m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 32Mi

externalSecrets:
  enabled: true
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  remoteSecretPath: muthur-collector/prod
  refreshInterval: 1h
  # Property name in the remote secret store that carries the URL of the
  # brain. Plaintext (not strictly sensitive) but kept here so the collector
  # chart can be installed without baking in environment-specific values.
  centralAgentUrlProperty: central-agent-url
  # Property name of the SHA-256-hashed one-time bootstrap token. After
  # successful bootstrap the token is invalidated server-side; this remote
  # entry can be deleted at that point.
  bootstrapTokenProperty: bootstrap-token

devSecrets:
  enabled: false
  centralAgentUrl: ""
  bootstrapToken: ""

resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
